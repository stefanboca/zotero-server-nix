[package]
name = "zotero-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
openidconnect = {
  version = "4.0.1",
  default-features = false,
  features = ["reqwest", "rustls-tls"]
}
reqwest = {
  version = "0.12.28",
  default-features = false,
  features = ["json", "rustls-tls"]
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = {
  version = "0.9.0",
  default-features = false,
  features = ["macros", "migrate", "mysql", "runtime-tokio"]
}
tokio = {
  version = "1.53.1",
  features = ["macros", "net", "rt-multi-thread", "signal"]
}
toml = "1.1.4+spec-1.1.0"
topcoat = {
  version = "0.5.0",
  default-features = false,
  features = ["cookie", "discover", "router", "serve", "session", "view"]
}
