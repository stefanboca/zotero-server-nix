[package]
name = "zotero-portal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
jiff = { version = "0.2", features = ["serde"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "mysql", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
toml = "1.1.4"
topcoat = { version = "0.6.2", default-features = false, features = ["asset", "cookie", "discover", "router", "runtime", "serve", "session", "tailwind", "tower", "view"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

# add the native roots feature to reqwest pulled in by openidconnect
reqwest = { version = "*", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }

[build-dependencies]
topcoat = { version = "0.6.2", default-features = false, features = ["tailwind"] }
