[package]
name = "zotero-portal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
openidconnect = {
  version = "4.0.1",
  default-features = false,
  features = ["reqwest", "rustls-tls"]
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = {
  version = "0.9.0",
  default-features = false,
  features = ["macros", "migrate", "mysql", "runtime-tokio"]
}
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = {
  version = "1.53.1",
  features = ["fs", "macros", "net", "rt-multi-thread", "signal"]
}
toml = "1.1.4"
topcoat = {
  version = "0.5.0",
  default-features = false,
  features = [
    "asset",
    "cookie",
    "discover",
    "router",
    "runtime",
    "serve",
    "session",
    "tailwind",
    "view"
  ]
}
url = "2.5.8"

# add the native roots feature to reqwest pulled in by openidconnect
reqwest = {
  version = "*",
  default-features = false,
  features = ["json", "rustls-tls-native-roots"]
}

[build-dependencies]
topcoat = {
  version = "0.5.0",
  default-features = false,
  features = ["tailwind"]
}
