[project]
name = "zotero-server"
revision = "1.0"

[providers]
environment = "env://"
systemd = "systemd-credential://"

[profiles.development]
AUTH_SALT = { description = "Salt used by the Zotero dataserver", default = "development-development-development" }
ATTACHMENT_PROXY_SECRET = { description = "HMAC secret shared with attachment-proxy", default = "development-development-development" }
DATASERVER_SUPER_PASSWORD = { description = "Password used by the portal to access the dataserver", default = "development" }
DATABASE_URL = { description = "MariaDB connection URL", default = "mysql://development:development@localhost:3306/zotero_www" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret", default = "development" }
PORTAL_COOKIE_KEY = { description = "Key used to authenticate portal session cookies", default = "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA==" }
S3_ACCESS_KEY_ID = { description = "S3 access key ID", default = "development-development-development" }
S3_SECRET_ACCESS_KEY = { description = "S3 secret access key", default = "development-development-development" }

[profiles.development.defaults]
providers = ["environment"]

[profiles.production]
AUTH_SALT = { description = "Salt used by the Zotero dataserver", type = "hex", generate = { bytes = 32 }, ref = { item = "AUTH_SALT" } }
ATTACHMENT_PROXY_SECRET = { description = "HMAC secret shared with attachment-proxy", type = "hex", generate = { bytes = 32 }, ref = { item = "ATTACHMENT_PROXY_SECRET" } }
DATASERVER_SUPER_PASSWORD = { description = "Password used by the portal to access the dataserver", type = "hex", generate = { bytes = 32 }, ref = { item = "DATASERVER_SUPER_PASSWORD" } }
DATABASE_URL = { description = "MariaDB connection URL" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret supplied by the administrator" }
PORTAL_COOKIE_KEY = { description = "Key used to authenticate portal session cookies", type = "base64", generate = { bytes = 64 }, ref = { item = "PORTAL_COOKIE_KEY" } }
S3_ACCESS_KEY_ID = { description = "S3 access key ID", type = "hex", generate = { bytes = 16 }, ref = { item = "S3_ACCESS_KEY_ID" } }
S3_SECRET_ACCESS_KEY = { description = "S3 secret access key", type = "hex", generate = { bytes = 32 }, ref = { item = "S3_SECRET_ACCESS_KEY" } }

[profiles.production.defaults]
providers = ["systemd"]

[scopes.generated]
secrets = ["AUTH_SALT", "ATTACHMENT_PROXY_SECRET", "DATASERVER_SUPER_PASSWORD", "PORTAL_COOKIE_KEY", "S3_ACCESS_KEY_ID", "S3_SECRET_ACCESS_KEY"]

[scopes.database]
secrets = ["DATABASE_URL"]
